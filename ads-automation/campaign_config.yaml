# ============================================================================
# Configuration de la campagne Google Ads — Élagage Abattage 37
# ----------------------------------------------------------------------------
# Tout est éditable ici. Le script setup_campaign.py lit ce fichier et crée
# la campagne via l'API. Aucune valeur n'est codée en dur dans le script.
# ============================================================================

# --- Compte ---
# Numéro de compte Google Ads (10 chiffres, sans tirets).
customer_id: "INSÉRER_CUSTOMER_ID"

# --- URL du site ---
# Domaine de production réel.
final_url_base: "https://www.elagageabattage37.com"

# --- Connexion automatique du tracking (Vercel) ---
# Si renseigné, le programme pousse lui-même les labels de conversion dans les
# variables d'environnement Vercel ET déclenche un redéploiement → le tracking
# s'active sans aucune action manuelle.
# Laisser token + deploy_hook_url vides pour désactiver (les labels seront
# alors juste affichés à coller à la main).
vercel:
  enabled: true
  project_id: "prj_viL20tFRVV3Ytjw547SFsHFbTkbH"
  team_slug: "heisenpears-projects"
  # Vercel → Account Settings → Tokens (https://vercel.com/account/tokens)
  token: ""
  # Vercel → Project → Settings → Git → Deploy Hooks (créer un hook sur "main")
  deploy_hook_url: ""

# --- Campagne ---
campaign:
  name: "[Search] Élagage Tours - Indre-et-Loire"

  # ENABLED = diffuse immédiatement | PAUSED = créée mais ne diffuse pas.
  status: "ENABLED"

  # GARDE-FOU PRINCIPAL : plafond mensuel ≈ daily × 30,4.
  # 15 €/j ≈ 456 €/mois maximum.
  daily_budget_eur: 15

  bidding:
    # MAXIMIZE_CLICKS : recommandé au lancement (pas d'historique de conversion).
    # MAXIMIZE_CONVERSIONS : à activer après ~15-30 conversions.
    # MANUAL_CPC : contrôle total manuel.
    strategy: "MAXIMIZE_CLICKS"
    # Plafond du coût par clic (garde-fou anti-dérapage). 0 = pas de plafond.
    cpc_bid_ceiling_eur: 2.0

  # Ciblage géographique par proximité (coordonnées de Joué-lès-Tours).
  geo:
    latitude: 47.3524
    longitude: 0.6642
    radius_km: 50
    # PRESENCE = personnes physiquement dans la zone (évite les clics hors zone).
    target_type: "PRESENCE"

  language: "fr" # français = languageConstants/1002

# --- Actions de conversion ---
# Créées par le script. Il affiche ensuite les labels (send_to) à coller dans
# les variables d'environnement du site (Vercel).
conversion_actions:
  - name: "Appel téléphonique (clic site)"
    category: "PHONE_CALL_LEAD"
    value_eur: 40
    env_var: "PUBLIC_GADS_CONV_CALL"
  - name: "Formulaire de devis"
    category: "SUBMIT_LEAD_FORM"
    value_eur: 50
    env_var: "PUBLIC_GADS_CONV_FORM"
  - name: "Clic email"
    category: "CONTACT"
    value_eur: 20
    env_var: "PUBLIC_GADS_CONV_EMAIL"

# --- Mots-clés négatifs (niveau campagne) ---
negative_keywords:
  - gratuit
  - gratuitement
  - emploi
  - recrutement
  - "offre d'emploi"
  - salaire
  - formation
  - "devenir élagueur"
  - "cap élagueur"
  - diplôme
  - métier
  - location
  - louer
  - matériel
  - tronçonneuse
  - nacelle
  - occasion
  - leboncoin
  - "bois de chauffage"
  - "acheter bois"
  - "prix du bois"
  - tuto
  - tutoriel
  - "comment élaguer"
  - "soi-même"
  - définition
  - wikipedia
  - mairie
  - "service public"
  - onf
  - permis

